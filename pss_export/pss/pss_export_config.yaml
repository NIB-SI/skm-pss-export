# -----------------------------------------------------------------------------
# Interaction network (and gene network): the edges each reaction gives
# -----------------------------------------------------------------------------
# Per reaction type and effect, a list of [source, target, influence, directed], where
# source/target are the reaction's participants:
#   substrates, products, modifiers (all modifiers),
#   activating_modifiers / inhibiting_modifiers (modifiers on ACTIVATES / INHIBITS edges)
# influence: positive, negative or unknown (SBGN Activity Flow, see influences)
# directed: directed, or mutual (both directions listed, marked undirected)
#
# Done in the code, not here:
# - nodes are entities (a node name), not species: location and form are edge attributes
# - no self-loops between a reaction's own inputs and outputs (e.g. an inactive -> active form,
#   a gene template -> its product, a translocation's from -> to); a modifier's influence on its own
#   entity (autoregulation, e.g. WRKY33 activating its own transcription) is kept
# - net effect: if a reaction gives two edges between the same pair of entities, the one to the
#   product is kept
# - condition nodes (form "condition") are left out
# - gene network: functional clusters expanded into their genes in one species (all gene pairs; for
#   autoregulation each gene -> itself); a reaction is only included if all its functional clusters
#   have genes in that species
# - reaction types without rules here (e.g. the deprecated cleavage/auto-cleavage) give no edges
#   (with a warning)
# See skm-webapp docs/reviews/2026-09-30-network-exports-rules.md for the reasons.
interaction_rules:
  binding/oligomerisation:
    activation:
      - [substrates, substrates, unknown, mutual]
      - [substrates, products, positive, directed]
      - [modifiers, products, positive, directed]
    inhibition:
      - [substrates, substrates, negative, mutual]
  catalysis:
    activation:
      - [substrates, products, positive, directed]
      - [modifiers, products, positive, directed]
      - [modifiers, substrates, negative, directed]
  degradation/secretion:
    inhibition:
      - [modifiers, substrates, negative, directed]
  dissociation:
    activation:
      - [substrates, products, positive, directed]
      - [modifiers, products, positive, directed]
      - [modifiers, substrates, negative, directed]
  protein activation:
    activation:
      - [modifiers, products, positive, directed]
  protein deactivation:
    # whichever edge type the curator used for the modifier
    inhibition:
      - [modifiers, products, negative, directed]
  transcriptional/translational activation:
    activation:
      - [activating_modifiers, products, positive, directed]
      - [inhibiting_modifiers, products, negative, directed]
  transcriptional/translational repression:
    inhibition:
      - [modifiers, products, negative, directed]
  translocation:
    # the move itself (from -> to) is a self-loop: translocations without a transporter give no edges
    activation:
      - [modifiers, products, positive, directed]
  unknown:
    activation:
      - [modifiers, products, positive, directed]
    inhibition:
      - [modifiers, products, negative, directed]

# the influences (SBGN Activity Flow): name in the network files, and SBO term
influences:
  positive: {interaction: positive-influence, sbo: '0000170'} # stimulation
  negative: {interaction: negative-influence, sbo: '0000169'} # inhibition
  unknown:  {interaction: unknown-influence,  sbo: '0000168'} # control
